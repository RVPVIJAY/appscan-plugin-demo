trigger:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  - group: appscan-plugin-state     # APPSCAN_APP_ID and APPSCAN_SCAN_ID (NONE until the first scan)

steps:
  - checkout: self

  - task: Maven@3
    displayName: 'Task 1 - Maven build'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean package'
      publishJUnitResults: false

  - script: echo APPSCAN_SCAN_ID is [$(APPSCAN_SCAN_ID)]
    displayName: 'Show scan ID (debug)'

  # ---------- First run: no scan ID stored yet ----------
  - task: HCLAppScanOnCloud@2
    displayName: 'Task 2 - First SCA scan (plug-in)'
    condition: and(succeeded(), eq(variables['APPSCAN_SCAN_ID'], 'NONE'))
    inputs:
      AppSecTestService: 'appscan360-conn'
      applications: '$(APPSCAN_APP_ID)'
      scanname: 'sample-app-sca-baseline-$(Build.BuildNumber)'
      scantype: 'sca'
      scanloc: '$(Build.SourcesDirectory)'
      scanMethod: 'IRX'

  
  
  - task: PowerShell@2
    displayName: 'Diagnose AppScan scan ID in build logs'
    condition: and(succeeded(), eq(variables['APPSCAN_SCAN_ID'], 'NONE'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      targetType: 'inline'
      script: |
        $ErrorActionPreference = "Stop"

        # Azure DevOps authentication
        $headers = @{
            Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"
        }

        # Build API URL
        $project = [uri]::EscapeDataString($env:SYSTEM_TEAMPROJECT)
        $base = "$($env:SYSTEM_COLLECTIONURI)$project/_apis"

        Write-Host "========================================"
        Write-Host "Starting AppScan Scan ID Log Inspection"
        Write-Host "========================================"

        # Retrieve all logs from current build
        $logs = Invoke-RestMethod `
            -Uri "$base/build/builds/$($env:BUILD_BUILDID)/logs?api-version=7.1" `
            -Headers $headers

        Write-Host "Logs found in this build: $($logs.count)"

        # Search each log
        foreach ($l in $logs.value) {

            Write-Host ""
            Write-Host "----------------------------------------"
            Write-Host "Checking Log ID: $($l.id)"
            Write-Host "----------------------------------------"

            try {

                $response = Invoke-WebRequest `
                    -Uri $l.url `
                    -Headers $headers `
                    -UseBasicParsing

                $logText = $response.Content

                $lines = $logText -split "`r?`n"

                foreach ($line in $lines) {

                    if (
                        $line -match '(?i)scan|submit|successfully' -or
                        $line -match '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
                    ) {

                        Write-Host "Relevant log: $line"

                    }
                }

            }
            catch {

                Write-Host "Unable to read Log ID $($l.id)"
                Write-Host $_.Exception.Message

            }
        }

        Write-Host ""
        Write-Host "========================================"
        Write-Host "Log Inspection Completed"
        Write-Host "========================================"



  # ---------- Later runs: scan ID exists ----------
  - task: HCLAppScanOnCloud@2
    displayName: 'Task 3 - SCA rescan (plug-in)'
    condition: and(succeeded(), ne(variables['APPSCAN_SCAN_ID'], 'NONE'))
    inputs:
      AppSecTestService: 'appscan360-conn'
      applications: '$(APPSCAN_APP_ID)'
      scanname: 'sample-app-sca-rescan-$(Build.BuildNumber)'
      scantype: 'sca'
      rescan: true
      scanid: '$(APPSCAN_SCAN_ID)'
      scanloc: '$(Build.SourcesDirectory)'
      scanMethod: 'IRX'
