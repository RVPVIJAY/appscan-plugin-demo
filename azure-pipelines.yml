trigger:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  - group: appscan-plugin-state     # APPSCAN_APP_ID and APPSCAN_SCAN_ID (NONE until the first scan)

steps:
  - checkout: self

  - task: Maven@3
    displayName: 'Task 1 - Maven build'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean package'
      publishJUnitResults: false

  - script: echo APPSCAN_SCAN_ID is [$(APPSCAN_SCAN_ID)]
    displayName: 'Show scan ID (debug)'

  # ---------- First run: no scan ID stored yet ----------
  - task: HCLAppScanOnCloud@2
    displayName: 'Task 2 - First SCA scan (plug-in)'
    condition: and(succeeded(), eq(variables['APPSCAN_SCAN_ID'], 'NONE'))
    inputs:
      AppSecTestService: 'appscan360-conn'
      applications: '$(APPSCAN_APP_ID)'
      scanname: 'sample-app-sca-baseline-$(Build.BuildNumber)'
      scantype: 'sca'
      scanloc: '$(Build.SourcesDirectory)'
      scanMethod: 'IRX'

  - task: PowerShell@2
    displayName: 'Save scan ID from Task 2 log (first run only)'
    condition: and(succeeded(), eq(variables['APPSCAN_SCAN_ID'], 'NONE'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      targetType: 'inline'
      script: |
        $ErrorActionPreference = "Stop"
        $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
        $project = [uri]::EscapeDataString($env:SYSTEM_TEAMPROJECT)
        $base = "$($env:SYSTEM_COLLECTIONURI)$project/_apis"

        # 1. List every log of this build and look for the scan ID line
        $logs = Invoke-RestMethod -Uri "$base/build/builds/$($env:BUILD_BUILDID)/logs?api-version=7.1" -Headers $headers
        Write-Host "Logs found in this build: $($logs.count)"
        $scanId = $null
        foreach ($l in $logs.value) {
          $text = (Invoke-WebRequest -Uri $l.url -Headers $headers -UseBasicParsing).Content
          $m = [regex]::Match($text, 'Successfully submitted scan:\s*([0-9a-fA-F\-]{36})')
          if ($m.Success) { $scanId = $m.Groups[1].Value; break }
        }
        if (-not $scanId) { throw "Scan ID not found in any log of this build" }
        Write-Host "Scan ID found: $scanId"

        # 2. Save it into the variable group
        $res = Invoke-RestMethod -Uri "$base/distributedtask/variablegroups?groupName=appscan-plugin-state&api-version=7.1" -Headers $headers
        if ($res.count -lt 1) { throw "Variable group 'appscan-plugin-state' not found" }
        $group = $res.value[0]
        $group.variables.APPSCAN_SCAN_ID.value = $scanId
        $body = $group | ConvertTo-Json -Depth 10
        Invoke-RestMethod -Method Put -Uri "$base/distributedtask/variablegroups/$($group.id)?api-version=7.1" -Headers $headers -ContentType "application/json" -Body $body | Out-Null
        Write-Host "Saved APPSCAN_SCAN_ID to variable group 'appscan-plugin-state'"

  # ---------- Later runs: scan ID exists ----------
  - task: HCLAppScanOnCloud@2
    displayName: 'Task 3 - SCA rescan (plug-in)'
    condition: and(succeeded(), ne(variables['APPSCAN_SCAN_ID'], 'NONE'))
    inputs:
      AppSecTestService: 'appscan360-conn'
      applications: '$(APPSCAN_APP_ID)'
      scanname: 'sample-app-sca-rescan-$(Build.BuildNumber)'
      scantype: 'sca'
      rescan: true
      scanid: '$(APPSCAN_SCAN_ID)'
      scanloc: '$(Build.SourcesDirectory)'
      scanMethod: 'IRX'
